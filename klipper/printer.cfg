# =====================================================================
#  DrainTek-grade reflow hot plate  -  Klipper config
#  Controller: Kingroon/Makerbase THR V2.0 (RP2040) over USB
#  Host: MKS Pi (Klipper + Moonraker + Mainsail)
#  Pins from Makerbase's official MKS_THR.cfg
# =====================================================================

[include reflow.cfg]
# [include mainsail.cfg]     # uncomment if KIAUH installed Mainsail's macros

[mcu]
# After flashing, run on the Pi:   ls /dev/serial/by-id/
# and paste the usb-Klipper_rp2040_XXXX line here:
serial: /dev/serial/by-id/usb-Klipper_rp2040_CHANGE_ME-if00
restart_method: command

[printer]
kinematics: none          # no motion - it's a hot plate
max_velocity: 1
max_accel: 1

# ---------------- Thermistor (Makerbase's measured curve for this board)
[adc_temperature thr_ntc]
temperature1: 27
voltage1: 3.156
temperature2: 34.8
voltage2: 3.10
temperature3: 42
voltage3: 3.01
temperature4: 81.0
voltage4: 2.354
temperature5: 140.7
voltage5: 1.029
temperature6: 171
voltage6: 0.619
temperature7: 234
voltage7: 0.222
temperature8: 300
voltage8: 0.098

# ---------------- The plate (HE0 heater output)
[heater_generic hotplate]
gcode_id: P
heater_pin: gpio0
sensor_type: thr_ntc
sensor_pin: gpio26
adc_voltage: 3.3
max_power: 0.6            # Makerbase stock cap - raise only after PID tune + testing
control: pid              # placeholder - run PID_CALIBRATE (see README)
pid_Kp: 26.213
pid_Ki: 1.304
pid_Kd: 131.721
min_temp: -10
max_temp: 265             # hard ceiling - Klipper shuts down above this

[verify_heater hotplate]  # thermal runaway protection
max_error: 120
check_gain_time: 60
hysteresis: 5
heating_gain: 2

# ---------------- Fans
[fan_generic cooling_fan] # FAN0 - blows under the plate for cooldown
pin: gpio1
kick_start_time: 0.5
shutdown_speed: 1.0       # if anything faults, fan goes full blast

[fan_generic aux_fan]     # FAN1 - spare (board/electronics fan if you want)
pin: gpio2
kick_start_time: 0.5

[temperature_sensor thr_mcu]
sensor_type: temperature_mcu

# ---------------- Stuff Mainsail/Moonraker expect
[virtual_sdcard]
path: ~/printer_data/gcodes
[display_status]
[pause_resume]
[respond]
[idle_timeout]
timeout: 900              # heater off after 15 min of nothing happening
