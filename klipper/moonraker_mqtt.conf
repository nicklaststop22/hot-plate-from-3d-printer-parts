# Paste this into ~/printer_data/config/moonraker.conf  then restart moonraker
# Publishes plate temp/target/power + fan to your Mosquitto broker.
[mqtt]
address: localhost          # Mosquitto runs on the same MKS Pi. Otherwise put the broker IP
port: 1883
# username: {secrets.mqtt.username}
# password: {secrets.mqtt.password}
instance_name: hotplate
enable_moonraker_api: True  # lets you send gcode (REFLOW etc) over MQTT
status_objects:
  heater_generic hotplate=temperature,target,power
  fan_generic cooling_fan=speed
  gcode_macro REFLOW=running,t
publish_split_status: True

# Topics you'll see (e.g. mosquitto_sub -t 'hotplate/#' -v):
#   hotplate/klipper/state/heater_generic hotplate/temperature
#   hotplate/klipper/state/heater_generic hotplate/target
#   hotplate/klipper/state/gcode_macro REFLOW/running
#
# Start a reflow over MQTT:
#   mosquitto_pub -t hotplate/moonraker/api/request -m \
#   '{"jsonrpc":"2.0","method":"printer.gcode.script","params":{"script":"REFLOW PROFILE=LEADED"},"id":1}'
