# =====================================================================
#  Reflow macros
#   REFLOW                    lead-free (SAC305) profile, peak 245C
#   REFLOW PROFILE=LEADED     Sn63/Pb37 profile, peak 215C
#   REFLOW_STOP               abort: heater off, fan on
#   PLATE_HOLD TEMP=150       just hold a temp (preheat / rework)
#
#  Smart clock: if the plate falls >15C behind the curve, the profile
#  clock pauses until it catches up, so a small heater never gets rushed.
#  Safety: aborts if the run takes way longer than the profile should.
# =====================================================================

[gcode_macro REFLOW]
description: Run a reflow profile. PROFILE=LEADFREE (default) or LEADED
variable_running: 0
variable_profile: 0        # 0 = lead-free, 1 = leaded
variable_t: 0              # profile clock (s)
variable_ticks: 0          # wall clock (s)
gcode:
  {% set p = params.PROFILE|default("LEADFREE")|upper %}
  {% if p not in ["LEADFREE", "LEADED"] %}
    { action_raise_error("PROFILE must be LEADFREE or LEADED") }
  {% endif %}
  SET_FAN_SPEED FAN=cooling_fan SPEED=0
  SET_GCODE_VARIABLE MACRO=REFLOW VARIABLE=profile VALUE={0 if p == "LEADFREE" else 1}
  SET_GCODE_VARIABLE MACRO=REFLOW VARIABLE=t VALUE=0
  SET_GCODE_VARIABLE MACRO=REFLOW VARIABLE=ticks VALUE=0
  SET_GCODE_VARIABLE MACRO=REFLOW VARIABLE=running VALUE=1
  RESPOND MSG="Reflow {p} started - hands off the plate"
  UPDATE_DELAYED_GCODE ID=reflow_tick DURATION=1

[delayed_gcode reflow_tick]
gcode:
  {% set m = printer["gcode_macro REFLOW"] %}
  {% if m.running %}
    {% set profiles = [
        [[0, 40], [90, 150], [180, 185], [230, 245], [250, 245]],
        [[0, 40], [90, 140], [180, 165], [220, 215], [240, 215]] ] %}
    {% set prof = profiles[m.profile] %}
    {% set t = m.t %}
    {% set end = prof[-1][0] %}
    {% set cur = printer["heater_generic hotplate"].temperature %}
    {% if m.ticks > end * 2 + 180 %}
      RESPOND TYPE=error MSG="Reflow ABORTED - plate can't keep up with the profile (heater too weak or loose thermistor)"
      REFLOW_STOP
    {% elif t >= end %}
      SET_HEATER_TEMPERATURE HEATER=hotplate TARGET=0
      SET_FAN_SPEED FAN=cooling_fan SPEED=1
      SET_GCODE_VARIABLE MACRO=REFLOW VARIABLE=running VALUE=0
      RESPOND MSG="Reflow done - cooling down. Don't touch the board yet."
      UPDATE_DELAYED_GCODE ID=reflow_cool DURATION=5
    {% else %}
      {% set ns = namespace(sp=prof[0][1]) %}
      {% for i in range(prof|length - 1) %}
        {% if t >= prof[i][0] and t < prof[i+1][0] %}
          {% set ns.sp = prof[i][1] + (prof[i+1][1] - prof[i][1]) * (t - prof[i][0]) / (prof[i+1][0] - prof[i][0]) %}
        {% endif %}
      {% endfor %}
      SET_HEATER_TEMPERATURE HEATER=hotplate TARGET={ "%.1f" % ns.sp }
      SET_GCODE_VARIABLE MACRO=REFLOW VARIABLE=t VALUE={ t + 1 if cur >= ns.sp - 15 else t }
      SET_GCODE_VARIABLE MACRO=REFLOW VARIABLE=ticks VALUE={ m.ticks + 1 }
      UPDATE_DELAYED_GCODE ID=reflow_tick DURATION=1
    {% endif %}
  {% endif %}

[delayed_gcode reflow_cool]
gcode:
  {% if printer["heater_generic hotplate"].temperature > 50 %}
    UPDATE_DELAYED_GCODE ID=reflow_cool DURATION=5
  {% else %}
    SET_FAN_SPEED FAN=cooling_fan SPEED=0
    RESPOND MSG="Plate under 50C - safe to grab your board"
  {% endif %}

[gcode_macro REFLOW_STOP]
description: Abort reflow - heater off, fan full
gcode:
  SET_GCODE_VARIABLE MACRO=REFLOW VARIABLE=running VALUE=0
  UPDATE_DELAYED_GCODE ID=reflow_tick DURATION=0
  SET_HEATER_TEMPERATURE HEATER=hotplate TARGET=0
  SET_FAN_SPEED FAN=cooling_fan SPEED=1
  RESPOND MSG="Reflow stopped - cooling"
  UPDATE_DELAYED_GCODE ID=reflow_cool DURATION=5

[gcode_macro PLATE_HOLD]
description: Hold the plate at TEMP (default 150). PLATE_HOLD TEMP=0 to turn off
gcode:
  {% set temp = params.TEMP|default(150)|float %}
  {% if temp > 250 %}{ action_raise_error("Max hold temp is 250") }{% endif %}
  SET_FAN_SPEED FAN=cooling_fan SPEED=0
  SET_HEATER_TEMPERATURE HEATER=hotplate TARGET={temp}
  RESPOND MSG="Holding plate at {temp}C"

[gcode_macro PID_TUNE_PLATE]
description: PID tune the plate at 200C. Run once after building, then SAVE_CONFIG
gcode:
  PID_CALIBRATE HEATER=hotplate TARGET=200
